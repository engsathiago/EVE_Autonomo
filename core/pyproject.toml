[project]
name = "agent-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings[yaml]>=2.6",
  "asyncpg>=0.30",
  "redis>=5.2",
  "anthropic>=0.40",
  "httpx>=0.28",
  "structlog>=24.4",
  "pyyaml>=6.0",
  # Phase 2: memory
  "sentence-transformers>=2.7.0",
  "torch>=2.2.0",
  "pgvector>=0.3.0",
  # Phase 3: skills
  "python-frontmatter>=1.1",
  "jinja2>=3.1",
  # Phase 4: multi-model
  "openai>=1.50.0",
  "ollama>=0.4.0",
  # Phase 6: cron + subagents
  "apscheduler==3.10.4",
  "croniter==2.0.5",
  "sqlalchemy==2.0.36",
  "psycopg2-binary==2.9.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "ruff>=0.8",
  "mypy>=1.13",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: testes que requerem Postgres rodando (desabilitar com -m 'not integration')",
  "docker: testes que requerem Docker daemon disponível (desabilitar com -m 'not docker')",
]

[tool.mypy]
python_version = "3.11"
strict = true
