# Alternativa ao rotation Python — use se preferir logrotate do sistema
/var/lib/agent/logs/agent.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    size 100M
    postrotate
        systemctl kill --signal=USR1 agent.service 2>/dev/null || true
    endscript
}
