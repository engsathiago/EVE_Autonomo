name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-lint:
    name: Python Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.8"

      - name: Run ruff check
        run: ruff check core/ cli/

      - name: Run ruff format check
        run: ruff format --check core/ cli/

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    env:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: testpw
      POSTGRES_DB: agent_test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0
      ANTHROPIC_API_KEY: dummy-for-tests
      AUTO_MIGRATE: "false"

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: agent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core + CLI
        run: |
          pip install --upgrade pip
          pip install -e "core[dev]"
          pip install "typer>=0.12" "rich>=13.0" "prompt_toolkit>=3.0"
          pip install --no-deps -e cli

      - name: Apply migrations
        run: |
          python -c "
          import asyncio, os, sys
          sys.path.insert(0, 'core/src')
          from agent.db.migrate import apply_migrations
          dsn = (
              f\"postgresql://{os.environ['POSTGRES_USER']}:{os.environ['POSTGRES_PASSWORD']}\"
              f\"@{os.environ['POSTGRES_HOST']}:{os.environ['POSTGRES_PORT']}/{os.environ['POSTGRES_DB']}\"
          )
          applied = asyncio.run(apply_migrations(dsn))
          print(f'Migrations aplicadas: {applied}')
          "

      - name: Run unit + web tests
        working-directory: core
        run: |
          PYTHONPATH=src python -m pytest \
            -m "not integration and not docker and not slow" \
            --ignore=tests/deploy/test_persistence.py \
            --ignore=tests/deploy/test_supervisor_internals.py \
            --tb=short \
            --cov=src \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=30 \
            -q

  node-tests:
    name: Node Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - name: Install dependencies
        working-directory: gateway
        run: npm ci

      - name: Build
        working-directory: gateway
        run: npm run build

      - name: Run tests
        working-directory: gateway
        run: npm test

  compose-validate:
    name: Docker Compose Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config > /dev/null

  secret-scan:
    name: Secret Scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
