[project]
name = "agent-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "prompt_toolkit>=3.0",
  "agent-core @ file:../core",
]

[project.scripts]
agent = "cli.main:app"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

[tool.ruff]
line-length = 100
target-version = "py311"
