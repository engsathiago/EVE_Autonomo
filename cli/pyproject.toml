[project]
name = "agent-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12",
  "rich>=13.0",
  "prompt_toolkit>=3.0",
]

[project.scripts]
agent = "cli.main:app"
eve = "cli.chat_cmd:app"

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = [
  "E501",   # line too long
  "F841",   # unused local variable
  "F821",   # undefined name
  "E402",   # module level import not at top
  "E741",   # ambiguous variable name
  "E731",   # lambda assignment
  "F541",   # f-string without placeholders
  "UP040",  # type alias
  "UP042",  # StrEnum
  "UP045",  # X | None syntax
]
