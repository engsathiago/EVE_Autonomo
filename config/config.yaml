agent:
  name: "Eve"
  default_model: "claude-haiku-4-5"
  max_iterations: 15
  reflection_every: 3
  context_compression_threshold: 0.5
  workspace_paths:
    - "/workspace"
    - "/tmp/agent"
    - "."
  shell_blacklist:
    - 'rm\s+-rf\s+/'
    - '\bmkfs\b'
    - '\bdd\s+if='
    - '>\s*/dev/sd'

search:
  provider: "tavily"
  tavily_api_key: ${TAVILY_API_KEY}
  brave_api_key: ${BRAVE_API_KEY}

providers:
  anthropic:
    api_key: ${ANTHROPIC_API_KEY}
    models:
      planner: "claude-haiku-4-5"
      reflector: "claude-sonnet-4-6"
  openai:
    api_key: ${OPENAI_API_KEY}
    models:
      default: "gpt-4o-mini"
  openrouter:
    api_key: ${OPENROUTER_API_KEY}
  ollama:
    host: "http://ollama:11434"
    models:
      memory: "qwen2.5:7b-instruct"
  ollama_cloud:
    base_url: "https://ollama.com"
    api_key: ${OLLAMA_CLOUD_API_KEY}
    timeout: 120

memory:
  postgres_url: ${POSTGRES_URL}
  embedding_model: "paraphrase-multilingual-MiniLM-L12-v2"

channels:
  telegram:
    enabled: false
    token: ${TELEGRAM_BOT_TOKEN}
  discord:
    enabled: false
    token: ${DISCORD_BOT_TOKEN}
  slack:
    enabled: false
    bot_token: ${SLACK_BOT_TOKEN}
    signing_secret: ${SLACK_SIGNING_SECRET}

critic:
  medium_model: "ollama_cloud:gpt-oss:20b-cloud"   # Técnico + Advogado do Diabo
  primary_model: "ollama_cloud:kimi-k2.5:cloud"    # Sintetizador (decisão final)
  cost_threshold_usd: 0.50
  enabled: true

missions:
  planner_model: "ollama_cloud:gpt-oss:20b-cloud"
  reflector_model: "ollama_cloud:kimi-k2.5:cloud"
  loop_interval_minutes: 5
  loop_enabled: true

sandbox:
  default: "docker"
  docker:
    image: "agent-sandbox:latest"
    timeout: 30

security:
  admin_user_id: ${ADMIN_USER_ID}
  approval_timeout_seconds: ${APPROVAL_TIMEOUT_SECONDS}

models:
  default_model: "ollama_cloud:deepseek-v3.1:cloud"
  # Fallback ativado se ollama_cloud estiver indisponível (erros de infra, timeout, 5xx).
  # Não dispara para 401/429 (erros de uso). Vazio = sem fallback.
  fallback_chain: "anthropic:claude-sonnet-4-6"

fallback_chain:
  - anthropic
  - openrouter
  - ollama
