<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Web UI</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: #0d0d0d;
      color: #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      flex-direction: column;
      gap: 1rem;
    }

    h1 { font-size: 1.6rem; color: #7dd3fc; letter-spacing: 0.05em; }
    p  { color: #6b7280; font-size: 0.9rem; }

    .badge {
      display: inline-block;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 4px;
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <h1>Agent Web UI</h1>
  <span class="badge">em construção — Fase 7</span>
  <p>A interface será implementada na Fase 7 do roadmap.</p>
  <script src="app.js"></script>
</body>
</html>
